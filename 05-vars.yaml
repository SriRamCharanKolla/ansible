- name: task level variables # Play name
  hosts: local # targets [local] group in inventory.ini
  connection: local # no SSH, runs locally on control node
  vars: # play-level variables - lowest priority, can be overridden by task-level vars
    COURSE: "DevOps with AWS" # this value will be OVERRIDDEN by task-level var below
    DURATION: "140hrs" # no task-level override, so this play-level value is used
    TRAINER: "Sivakumar Reddy" # no task-level override, so this play-level value is used
  tasks:
  - name: print variables # Task with its own vars
    vars: # task-level variables - HIGHER priority than play-level vars. Output: COURSE = "Ansible" (not "DevOps with AWS")
      COURSE: "Ansible" # overrides play-level COURSE. Priority: extra-vars(-e) > task vars > play vars
    ansible.builtin.debug:
      msg: "Course is {{ COURSE }}, Duration is {{ DURATION }}, Trainer is {{ TRAINER }}" # COURSE prints "Ansible", rest from play-level