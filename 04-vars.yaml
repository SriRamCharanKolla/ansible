- name: play level variables # Play name
  hosts: local # targets [local] group in inventory.ini (localhost)
  connection: local # runs tasks locally on control node, no SSH connection needed
  vars: # play-level variables - available to all tasks in this play. Override priority: extra-vars > task vars > play vars
    COURSE: "DevOps with AWS" # variable defined as key: value pair
    DURATION: "140hrs"
    TRAINER: "Sivakumar Reddy"
  tasks:
  - name: print variables # Task: print variable values using debug module
    ansible.builtin.debug:
      msg: "Course is {{ COURSE }}, Duration is {{ DURATION }}, Trainer is {{ TRAINER }}" # {{ }} = Jinja2 template syntax to access variables